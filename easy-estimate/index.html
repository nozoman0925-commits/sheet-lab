<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桜ミツ OUMITSU</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/splash.css">
</head>
<body>
<div class="app">
  <div class="side-aura" aria-hidden="true"></div>
  <aside class="sidebar">
    <div class="brand">
      <span id="brand-crest"></span>
      <div><div class="brand-name">桜ミツ</div><div class="brand-sub">OUMITSU</div></div>
    </div>
    <nav class="nav" id="nav" aria-label="メインメニュー"></nav>
    <div class="side-user" id="side-user"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h1 id="title"></h1><div class="crumb" id="crumb"></div></div>
      <div class="spacer"></div>
      <div id="actions" style="display:flex;gap:10px;align-items:center"></div>
    </header>
    <div class="view" id="view">
      <div class="view-inner">
        <div class="grid kpis">
          <div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div>
          <div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div>
        </div>
        <div class="sk" style="height:300px;margin-top:18px"></div>
      </div>
    </div>
  </main>
</div>
<div class="toasts"></div>
<div id="print-root"></div>

<script src="js/crest.js"></script>
<script src="js/splash.js"></script>
<script src="js/engine.js"></script>
<script src="js/parse.js"></script>
<script src="js/docparse.js"></script>
<script src="js/filestore.js"></script>
<script src="js/check.js"></script>
<script src="js/catalog.js"></script>
<script src="js/data.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/print.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/docs.js"></script>
<script src="js/views/editor.js"></script>
<script src="js/calc-tool.js"></script>
<script src="js/views/quick.js"></script>
<script src="js/views/importer.js"></script>
<script src="js/views/clients.js"></script>
<script src="js/views/settings-extra.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
<script>
  // 起動アニメーションの裏でアプリを起動し、終わったらホームの展開アニメーションを始める
  EE.app.boot({ deferIntro: true });
  EE.splash.play({ onDone: function () { EE.app.intro(); } });
</script>
</body>
</html>
