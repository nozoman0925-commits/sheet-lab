<script>
  // 起動の流れ：ロゴ登場 → 一拍（この間にアプリを起動）→ ロゴが定位置へ → 画面が開く。
  // サインインが要るときは業務データを読み込まず、ログイン画面を先に（見せずに）組み立てて、
  // 狭い画面ではそのカード上部をロゴの着地点にする。スキップされたらその場で進める。
  document.getElementById('brand-crest').innerHTML = EE.crest.svg({ id: 'brand', className: 'brand-crest', fieldR: 106 });
  var started = false;
  function bootNow(user) { if (started) return; started = true; EE.app.boot({ deferIntro: true, user: user }); }
  var gate = EE.auth.current() ? null : EE.login.gate(function (user) { bootNow(user); EE.app.intro(); });
  if (!gate) setTimeout(function () { bootNow(EE.auth.current()); }, 600);
  EE.splash.play({
    target: function () { return gate && gate.target(); },
    onReveal: function () { if (gate) gate.reveal(); else { bootNow(EE.auth.current()); EE.app.intro(); } }
  });
</script>
