<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="名簿クレンジングシートのサムネイル案">
  <rect width="600" height="600" fill="#f4f8f4"/>
  <rect x="40" y="40" width="520" height="520" rx="24" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/>
  <text x="300" y="120" font-size="40" font-weight="bold" text-anchor="middle" fill="#1b5e20" font-family="sans-serif">名簿クレンジングシート</text>
  <text x="300" y="165" font-size="22" text-anchor="middle" fill="#444" font-family="sans-serif">会社名・電話番号をそろえて重複チェック</text>
  <rect x="80" y="210" width="190" height="60" fill="#fdecea"/><text x="175" y="248" font-size="24" text-anchor="middle" fill="#b71c1c" font-family="sans-serif">(株)山田商事</text>
  <rect x="80" y="280" width="190" height="60" fill="#fdecea"/><text x="175" y="318" font-size="24" text-anchor="middle" fill="#b71c1c" font-family="sans-serif">㈱山田商事</text>
  <text x="300" y="300" font-size="40" text-anchor="middle" fill="#2e7d32" font-family="sans-serif">→</text>
  <rect x="330" y="245" width="190" height="60" fill="#e8f5e9"/><text x="425" y="283" font-size="22" text-anchor="middle" fill="#1b5e20" font-family="sans-serif">株式会社山田商事</text>
  <text x="300" y="430" font-size="24" text-anchor="middle" fill="#333" font-family="sans-serif">マクロなし・関数のみ</text>
  <text x="300" y="470" font-size="20" text-anchor="middle" fill="#666" font-family="sans-serif">Excel用(動作確認の範囲は商品ページに記載)</text>
</svg>
