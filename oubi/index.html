  if(t==='auto')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')})();</script>

<!-- 速さ（Lighthouse の診断より）：本文と数字はスマホの標準の字（PayPay・LINEと同じ考え方）。明朝は見出し用だけを、画面を止めずに後から読む。
     記録の通信先には先につないでおく -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://qnsfavxojxxbdeuwvyae.supabase.co" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&display=swap"></noscript>
<style>
/* 土台（画面の端の余白・余白のリセット） */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: 和風・木目。地は檜の木目、見出しと屋号は明朝、カードは和紙色、主色は藍、家紋は墨。スマホは下部に濃い木の帯 */
:root{
  --bg:#e6d4b5; --bg2:#ecdcc0; --surface:#fbf7ee; --sunk:#f2eadb; --ink:#2a2119; --muted:#766858; --line:#dccbad;
  --blue:#2e4c6f; --blue-soft:#e2e7ec; --sakura:#9c3d3d; --sakura-soft:#f4e2dc; --lav:#7a6142; --steel:#2e4c6f;
  --ok:#3d7748; --ok-soft:#e3eedf; --warn:#a46c18; --warn-soft:#f6ead2; --bad:#ae3a2e; --bad-soft:#f6e0da;
  --wood:#4b3526; --wood2:#3d2b1f; --on-wood:#f4ead6; --on-wood-mute:#cdbb9f;
  --grain-a:rgba(120,78,36,.08); --grain-b:rgba(96,60,28,.06);
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 2px 8px rgba(70,45,20,.10);
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-num:var(--f-body);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#241a12; --bg2:#2a1f16; --surface:#30251b; --sunk:#3a2d21; --ink:#f0e6d4; --muted:#b4a58f; --line:#4c3c2c;
  --blue:#a9c0dc; --blue-soft:#2b3542; --sakura:#e39a8e; --sakura-soft:#43281f; --lav:#cfb48d; --steel:#a9c0dc;
  --ok:#86c493; --ok-soft:#203424; --warn:#e6b15c; --warn-soft:#3d2f17; --bad:#f09484; --bad-soft:#45231c;
  --wood:#1b130d; --wood2:#140e09; --on-wood:#f0e6d4; --on-wood-mute:#a8977f;
  --grain-a:rgba(0,0,0,.22); --grain-b:rgba(255,220,170,.03);
  --shadow:0 2px 8px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#241a12; --bg2:#2a1f16; --surface:#30251b; --sunk:#3a2d21; --ink:#f0e6d4; --muted:#b4a58f; --line:#4c3c2c;
  --blue:#a9c0dc; --blue-soft:#2b3542; --sakura:#e39a8e; --sakura-soft:#43281f; --lav:#cfb48d; --steel:#a9c0dc;
  --ok:#86c493; --ok-soft:#203424; --warn:#e6b15c; --warn-soft:#3d2f17; --bad:#f09484; --bad-soft:#45231c;
  --wood:#1b130d; --wood2:#140e09; --on-wood:#f0e6d4; --on-wood-mute:#a8977f;
  --grain-a:rgba(0,0,0,.22); --grain-b:rgba(255,220,170,.03);
  --shadow:0 2px 8px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:
  repeating-linear-gradient(178.6deg,transparent 0 9px,var(--grain-a) 9px 10px,transparent 10px 23px),
  repeating-linear-gradient(181.2deg,transparent 0 37px,var(--grain-b) 37px 40px,transparent 40px 71px),
  radial-gradient(ellipse 60% 18% at 30% 22%,var(--grain-b),transparent 70%),
  linear-gradient(180deg,var(--bg2),var(--bg) 45%,var(--bg2));
  background-color:var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.65}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:8px 18px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:900;font-size:1.35rem;letter-spacing:.12em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.brand small{font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.02em}
nav.tabs{display:flex;gap:4px;flex:1 1 auto;min-width:0;justify-content:center}
nav.tabs button{border:none;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:6px;position:relative}
nav.tabs button svg{width:18px;height:18px}
nav.tabs button[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
nav.tabs .plus{background:var(--blue);color:#fff;border-radius:50%;width:36px;height:36px;padding:0;justify-content:center;box-shadow:0 4px 12px color-mix(in srgb,var(--blue) 45%,transparent)}
nav.tabs .plus svg{width:20px;height:20px}
nav.tabs .cnt{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.66rem;display:inline-grid;place-items:center;line-height:1}
.who-am-i{font-size:.75rem;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.who-am-i i{width:26px;height:26px;border-radius:50%;background:var(--sakura-soft);color:var(--sakura);display:grid;place-items:center;font-style:normal;font-weight:700}
main{max-width:1240px;margin:0 auto;padding-block:20px 60px;display:grid;gap:20px}
@media (max-width:820px){
  .top{backdrop-filter:none;background:var(--surface)}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;align-items:center;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:0}
  nav.tabs button{flex-direction:column;gap:1px;font-size:.64rem;padding:4px 6px;border-radius:8px}
  nav.tabs button[aria-current="page"]{background:none}
  nav.tabs .plus{width:48px;height:48px;margin-top:-22px;flex:none}
  nav.tabs .lbl-wide{display:none}
  nav.tabs .cnt{position:absolute;top:0;right:2px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .who-am-i .who-lbl{display:none}
  .top-in{justify-content:space-between}
}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:1.4rem;font-weight:700}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.sub{color:var(--muted);font-size:.84rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:.86rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--blue) 30%,transparent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.78rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.row.sb{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.sk{background:var(--blue-soft);color:var(--blue)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th{text-align:left;color:var(--muted);font-weight:700;font-size:.72rem;letter-spacing:.04em;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunk)}
.meter{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--blue)}

/* ダッシュボード */
.hero{display:grid;gap:4px}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:1.55rem;letter-spacing:.06em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:0;box-shadow:var(--shadow)}
.kpi .l{font-size:.74rem;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--f-num);font-size:1.3rem;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.72rem;color:var(--muted);font-family:var(--f-body);margin-left:2px}
.big4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.big4 button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 8px;display:grid;justify-items:center;gap:2px;cursor:pointer;box-shadow:var(--shadow)}
.big4 b{font-family:var(--f-num);font-size:1.9rem;line-height:1.1;font-weight:500}
.big4 span{font-size:.74rem;color:var(--muted);font-weight:700}
.big4 .c1 b{color:var(--blue)} .big4 .c2 b{color:var(--bad)} .big4 .c3 b{color:var(--warn)} .big4 .c4 b{color:var(--lav)}
.week{display:grid;gap:8px}
.wk{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.wk .dt{display:grid;justify-items:center;background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:6px 0;line-height:1.2}
.wk .dt b{font-family:var(--f-num);font-size:.95rem}
.wk .dt small{font-size:.68rem}
.wk .bd{display:grid;min-width:0;line-height:1.45}
.wk .bd b{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .bd span{font-size:.78rem;color:var(--muted)}
/* 起動画面：2つのボタンだけ */
.launch{min-height:calc(100dvh - 160px);display:grid;align-content:center;justify-items:center;gap:14px;padding-block:24px}
.launch-logo{width:64px;height:64px}
.launch h1{font-family:var(--f-display);font-weight:900;font-size:2rem;letter-spacing:.16em;margin-bottom:12px}
.launch-btns{display:grid;gap:14px;width:min(100%,440px)}
.launch-btn{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;align-items:center;text-align:left;padding:22px 20px;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer}
.launch-btn:hover{border-color:var(--blue)}
.launch-btn .lb-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;font-weight:700;background:var(--blue-soft);color:var(--blue)}
.launch-btn.new{background:var(--blue);border-color:var(--blue);color:#fff}
.launch-btn.new .lb-ic{background:rgba(255,255,255,.2);color:#fff}
.launch-btn .lb-tx{display:grid;gap:2px}
.launch-btn b{font-size:1.2rem}
.launch-btn small{font-size:.8rem;opacity:.75}
.mobile-only{display:none}
nav.tabs[hidden]{display:none!important}
/* 社員 */
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--blue);color:var(--surface);font-family:var(--f-display);font-weight:700}
.staffs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.staff-card{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center;text-align:left;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;min-width:0}
.staff-card:hover{border-color:var(--blue)}
.sc-tx{display:grid;gap:1px;min-width:0}
.sc-tx b{font-family:var(--f-display);font-size:1.05rem}
.who-btn{display:flex;align-items:center;gap:8px;border:none;background:none;color:inherit;cursor:pointer;padding:2px 4px;border-radius:999px}
.who-btn .av{border:2px solid var(--on-wood)}
.author{font-size:.8rem}
.prof{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.prof-photo{display:grid;gap:8px;justify-items:center}
@media (max-width:520px){.prof{grid-template-columns:minmax(0,1fr)}}
.btn.big{padding:12px 22px;font-size:1rem}
.toast{display:flex;gap:14px;align-items:center;justify-content:space-between;width:max-content;max-width:calc(100vw - 32px)}
.toast-undo{border:1px solid currentColor;background:transparent;color:inherit;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:40px}
/* 今日やること・次にやること */
.today{width:min(100%,440px);display:grid;gap:8px;margin-top:6px}
.today h2{font-size:1rem}
.td-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;background:var(--surface);padding:10px 12px;cursor:pointer;min-height:52px}
.td-item.bad{border-left-color:var(--bad)} .td-item.warn{border-left-color:var(--warn)}
.td-item .ti{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap}
.td-item .tx{display:grid;gap:1px;min-width:0}.td-item .tx b{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:500;line-height:1.45}
.td-item.bad .ti{color:var(--bad)} .td-item.warn .ti{color:var(--warn)}
.td-item .go,.wk .go{color:var(--blue);font-weight:700;white-space:nowrap}
.next{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--blue-soft);border-radius:8px;padding:10px 14px}
.next b{color:var(--blue)}
.quick .scope{gap:6px}
/* 担当者の選択画面 */
.whob{justify-content:flex-start;width:100%;font-weight:500;min-height:40px;background:var(--sunk)}
.whob .wn{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis}
.whob .caret{color:var(--muted)}
.picker{position:fixed;inset:0;z-index:60;background:rgba(30,20,10,.45);display:grid;place-items:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.pk-box{background:var(--surface);border-radius:10px;width:min(100%,480px);max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden}
.pk-box input{border:1px solid var(--line);border-radius:6px;padding:11px 12px;background:var(--sunk);font-size:1rem;width:100%}
.pk-sec{font-size:.74rem;color:var(--muted);font-weight:700}
.pk-list{overflow-y:auto;display:grid;gap:4px;align-content:start;flex:1 1 auto;min-height:0}
.pk-box>*{flex-shrink:0}.pk-box>.pk-list{flex-shrink:1}
.pk-item{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;cursor:pointer;min-height:52px}
.pk-item:hover,.pk-item.on{border-color:var(--blue);background:var(--blue-soft)}
.pk-tx{display:grid;min-width:0}.pk-tx small{color:var(--muted)}
/* 表示する案件の切り替え */
.scope{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.84rem;cursor:pointer;min-height:38px}
.chipbtn.on{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.cal .ev.more{background:transparent;color:var(--muted);text-decoration:underline}
/* スマホのカレンダーは日ごとの一覧（マス目は小さくて押せないため） */
.agenda{display:none;gap:10px}
.ag-day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px}
.ag-day.today{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.ag-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display)}
.ag-ev{display:grid;text-align:left;gap:1px;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:6px;background:var(--surface);padding:8px 10px;min-height:48px;cursor:pointer}
.ag-ev span{font-size:.86rem;color:var(--muted)}
@media (max-width:600px){.agenda{display:grid}.cal-wrap,.cal-grid-note{display:none}}
/* スマホの月の表 */
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px}
.mcal .mh{text-align:center;font-size:.8rem;font-weight:700;color:var(--muted);padding:2px 0}
.mcal .mh.sun{color:var(--bad)} .mcal .mh.sat{color:var(--blue)}
.mcal .md{position:relative;min-height:48px;border:1px solid transparent;border-radius:6px;background:var(--sunk);display:grid;place-items:center;align-content:center;gap:2px;cursor:pointer;font-family:var(--f-num);font-size:.95rem;padding:2px 0}
.mcal .md.out{background:transparent;color:var(--muted)}
.mcal .md.today span{background:var(--blue);color:var(--surface);border-radius:4px;padding:0 5px}
.mcal .md.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1px var(--blue)}

.skel i{display:block;height:56px;border-radius:8px;background:linear-gradient(90deg,var(--sunk) 25%,var(--surface) 50%,var(--sunk) 75%);background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.skel i{animation:shimmer 1.4s infinite linear}@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}}
/* 最近開いた工事 */
.recent{width:min(100%,440px);display:grid;gap:6px}
.recent h2{font-size:1rem}
.rc-row{display:flex;gap:6px;flex-wrap:wrap}
.rc{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc:hover{border-color:var(--blue)}
/* 絞り込み中の表示 */
.fchip{display:inline-flex;align-items:center;gap:8px;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:4px 6px 4px 14px;font-weight:700;font-size:.86rem}
.fchip button{border:none;background:var(--surface);color:var(--ink);border-radius:999px;min-height:32px;padding:0 12px;cursor:pointer;font-weight:700}
/* 案件一覧：スマホはカード、PCは表 */
.ccards{display:none;gap:8px}
.ccard{display:grid;gap:6px;text-align:left;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px;cursor:pointer}
.ccard:hover{border-color:var(--blue)}
.ccard .cc-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ccard .cc-h b{font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .cc-m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.86rem;color:var(--muted)}
@media (max-width:820px){.ccards{display:grid}.ctable{display:none}}
table.t tr.click:focus-visible td{background:var(--blue-soft)}
.err{color:var(--bad);font-size:.84rem;font-weight:700}
.fld input[aria-invalid="true"]{border-color:var(--bad)}
/* ===== 入口：会社の合言葉（最初の1回だけ） ===== */
.gate{position:fixed;inset:0;z-index:100;overflow-y:auto;background:inherit;background-color:var(--bg);display:grid;place-items:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.gate-box{width:min(100%,420px);display:grid;gap:18px;justify-items:center;text-align:center}
.gate-box .mon{width:96px;height:96px;color:var(--ink)}
.gate-box h1{font-family:var(--f-display);font-weight:900;font-size:2.1rem;letter-spacing:.3em;margin-right:-.3em}
.gate-card{width:100%;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:8px;padding:22px 18px;display:grid;gap:14px;text-align:left;box-shadow:var(--shadow)}
.gate-card label{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.gate-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.gate-row input{border:2px solid var(--line);border-radius:8px;padding:14px;background:var(--sunk);font-size:1.3rem;min-height:60px;width:100%;letter-spacing:.06em}
.gate-row input:focus{border-color:var(--blue);background:var(--surface)}
.gate-row input[aria-invalid="true"]{border-color:var(--bad)}
.gate-eye{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:72px;font-weight:700;cursor:pointer}
.gate-go{width:100%;min-height:64px;border:none;border-radius:8px;background:var(--blue);color:var(--surface);font-size:1.3rem;font-weight:700;cursor:pointer;font-family:var(--f-display);letter-spacing:.1em}
.gate-go:disabled{opacity:.6}
.gate-err{color:var(--bad);font-weight:700;font-size:1rem;margin:0}
.gate-help{color:var(--muted);font-size:.95rem;margin:0;line-height:1.7}
/* ===== あなたはだれですか（その端末で最初の1回だけ） ===== */
.pickme{display:grid;gap:16px;justify-items:center;text-align:center;padding-block:12px}
.pickme .mon{width:64px;height:64px;color:var(--ink)}
.pickme h1{font-family:var(--f-display);font-size:1.7rem;letter-spacing:.08em}
.pm-list{width:min(100%,560px);display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.pm-btn{display:grid;justify-items:center;gap:8px;padding:18px 10px;min-height:120px;border:2px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;box-shadow:var(--shadow)}
.pm-btn:hover,.pm-btn:focus-visible{border-color:var(--blue)}
.pm-btn b{font-size:1.15rem;font-family:var(--f-display)}
.pm-new{width:min(100%,560px);text-align:left}
.pm-new input{font-size:1.2rem!important;min-height:56px!important}
/* ホーム画面に追加の案内 */
.a2hs{width:min(100%,440px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--blue-soft);border-radius:8px;padding:12px 14px;text-align:left;font-size:.92rem}
.a2hs b{color:var(--blue)}
/* ===== 模擬テスト サイクル1：文字は14px以上、押すものは48px以上（老眼・手袋でも） ===== */
.sub,.chip,.fld>span,.kpi .l,.stp small,.wk .dt small,.wk .bd span,.pk-sec,.savebadge,.blast,.cal .ev,.cal .dn,.cal .dh,.mcal .mh,
table.t th,table.t td,.live,.author,.big4 span,.tw-btn,.cc-m,.ag-ev span,.td-item .ti,.alert b,.alert span,.launch-btn small,.calc span,.flow div,
.file,.note,.lock,.pr-n,.checks label,.subtabs button,.chipbtn,.btn,.btn.sm,.seg button,.tw-case,.tw-more,.rc,.fchip,.who-am-i,.empty,.miss,.log,.pk-tx small,.cal .ev.more,small,
.ccard .cc-m,.ccard .cc-m span,.kpi .v small,.sn,.stp .dot,.launch-sub,.file a,.wk .bd span,.alert b,.live,.cnt,.sc-btn .cnt,nav.tabs .cnt,.mcal .md i,.dh{font-size:.875rem!important}
nav.tabs button{font-size:.875rem!important}
.cnt{min-width:22px!important;height:22px!important}
.btn,.btn.sm,.chipbtn,.seg button,.tw-btn,.tw-more,.tw-case,.subtabs button,.checks label,.rc,.fchip button,.toast-undo,.sheet-item,.pk-item,.ag-ev,.td-item,.alert,.wk,.prow,.ccard,.staff-card,
.fld input,.fld select,.fld textarea,input.btn,select.btn,.quick a,.quick span.q,.stp,label.btn,.file a{min-height:48px!important}
.file a{display:inline-flex;align-items:center}
.mcal{gap:2px;padding:4px}
/* ===== サイクル2：カレンダーのマスを画面いっぱいに広げて48px近くに。PCの上のボタンも48px ===== */
/* サイクル3：タブレット（指で使う）もスマホと同じ大きな月の表に。細かいマス目はPCだけ */
@media (max-width:820px){.agenda{display:grid}.cal-wrap,.cal-grid-note{display:none}}
/* サイクル4：小さい画面（高さ720px以下）では、家紋と社名を小さくして近道を最初の画面に収める */
@media (max-width:820px) and (max-height:720px){.launch-logo.mon,.launch-sub{display:none}.launch h1{font-size:1.4rem;letter-spacing:.2em}.launch{gap:10px;padding-block:8px}.launch-btn{padding:12px 14px}.launch-btn .lb-ic{width:44px;height:44px}.launch-btn small{display:none}.sc-btn{min-height:64px}}
/* サイクル5：とても小さい画面（幅340px以下）は7列に48pxが入らないので、日付を横に流して1日ずつ大きく押せるように */
.mcal .wd{display:none}
@media (max-width:340px){
  .mcal{display:flex;overflow-x:auto;gap:4px;padding:4px 12px;scroll-snap-type:x proximity}
  .mcal .mh,.mcal .md.out{display:none}
  .mcal .md{flex:0 0 52px;min-height:64px;scroll-snap-align:center}
  .mcal .wd{display:block;font-size:.875rem!important;color:var(--muted)}
}
/* ===== v3：工程は横にスライドさせず、全部を一度に見せる（スマホは3列×3段） ===== */
.stepper{overflow:visible;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.stp small{white-space:normal;text-align:center;line-height:1.25;word-break:keep-all}
@media (max-width:820px){
  .stepper{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0}
  .stepper::before{display:none}
  .stp{display:flex;align-items:center;justify-content:flex-start;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:left;min-height:52px}
  .stp .dot{width:28px!important;height:28px!important;flex:none}
  .stp small{text-align:left;font-size:.8rem!important;word-break:normal;overflow-wrap:anywhere;line-height:1.2;min-width:0}
  .stp{padding:6px 6px;gap:5px}
  .stp .dot{width:24px!important;height:24px!important;font-size:.75rem!important}
  .stp[aria-current="step"]{border-color:var(--blue);background:var(--blue-soft)}
  .stp.done{background:var(--sunk)}
}
/* ===== v3：ホワイトボード（チャットのように） ===== */
.wb-day{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.wb-day.tm{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.wb-day h2{font-size:1.05rem}
.wb-msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start}
.wb-b{background:var(--sunk);border-radius:4px 12px 12px 12px;padding:8px 12px;min-width:0}
.wb-msg.mine .wb-b{background:var(--blue-soft)}
.cal .ev.wbev{background:var(--ok-soft);color:var(--ok)}
.ag-ev.wbag{border-left-color:var(--ok)}
/* ===== v3：暗証番号の入力（大きな数字ボタン） ===== */
.pinpad{display:grid;justify-items:center;gap:10px;text-align:center;padding-block:10px 20px}
.pinpad h1{font-family:var(--f-display);font-size:1.5rem}
.pin-t{margin:0;font-size:1.1rem;font-weight:700}
.pin-dots{display:flex;gap:16px;margin:6px 0}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);display:block}
.pin-dots i.on{background:var(--ink)}
.pin-err{min-height:1.5em;margin:0;color:var(--bad);font-weight:700}
.pin-keys{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pk{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.8rem;font-family:var(--f-num);cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.pk:active{background:var(--blue-soft)}
.pk:disabled{opacity:.4}
/* 下のボタンは画面に固定（スクロールで動かない）。独立した層にして、iPhone でもずれないようにする */
@media (max-width:820px){nav.tabs{position:fixed!important;left:0;right:0;bottom:0;transform:translateZ(0);-webkit-transform:translateZ(0)}}
.doc-prev{contain:paint;position:relative;width:100%;max-width:100%}
.doc-prev .doc-scale{position:absolute;top:0;left:0}
.docbox{min-width:0}
.docbox .btn.big,.btn.big{white-space:normal;text-align:center;line-height:1.35}
.btn{max-width:100%}
/* 利益の表：スマホでは1行ずつ「予定／実績／見込」を並べる */
@media (max-width:480px){
  .pf-t,.pf-t tbody{display:block}
  .pf-t tr:first-child{display:none}
  .pf-t tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
  .pf-t td{border:none!important;padding:0!important;text-align:left!important;height:auto!important;min-width:0;overflow-wrap:anywhere}
  .pf-t td:first-child{grid-column:1/-1;font-weight:700}
  .pf-t td:nth-child(2)::before{content:"予定";display:block;font-size:.75rem;color:var(--muted)}
  .pf-t td:nth-child(3)::before{content:"実績";display:block;font-size:.75rem;color:var(--muted)}
  .pf-t td:nth-child(4)::before{content:"完成見込";display:block;font-size:.75rem;color:var(--muted)}
  .pf-t td:empty::before{content:none}
}
/* ===== ロゴ：いただいた画像をそのまま表示（形・色は変えない） ===== */
img.logo-img{display:block;object-fit:contain;background:#fff;border-radius:6px;flex:none}
.brand img.logo-img{width:38px;height:38px;padding:2px}
.launch-logo.logo-img{width:110px;height:110px;padding:4px}
.gate-box .logo-img{width:110px;height:110px;padding:4px}
.pickme .logo-img{width:72px;height:72px;padding:3px}
@media (max-width:820px){img.launch-logo.logo-img{width:92px!important;height:92px!important}}
/* ===== 右上：社員一覧・ヘルプ・自分のアイコン ===== */
.hw{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.hd-btn{width:44px;height:44px;min-height:44px;border-radius:50%;border:2px solid rgba(255,240,215,.45);background:rgba(255,240,215,.12);color:var(--on-wood);display:grid;place-items:center;cursor:pointer;font-weight:900;font-size:1.25rem;padding:0;font-family:var(--f-display)}
.hd-btn svg{width:24px;height:24px}
.hd-btn:hover,.hd-btn:focus-visible{background:rgba(255,240,215,.25)}
.hd-btn[aria-current="page"]{background:var(--on-wood);color:var(--wood)}
/* ===== ヘルプ ===== */
.help-list{display:grid;gap:8px}
.help-item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 14px}
.help-item summary{display:flex;gap:8px;align-items:center;min-height:56px;cursor:pointer;list-style:none;padding:8px 0}
.help-item summary::-webkit-details-marker{display:none}
.help-item summary::after{content:"＋";margin-left:auto;color:var(--blue);font-weight:700}
.help-item[open] summary::after{content:"－"}
.help-item p{margin:0 0 12px;line-height:1.8}
.help-item .btn{margin-bottom:14px}
mark{background:var(--warn-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.flash{box-shadow:0 0 0 4px var(--blue)!important;transition:box-shadow .3s}
.admin-info summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.admin-list{margin:8px 0;padding-left:1.2em;display:grid;gap:6px;font-size:.92rem;color:var(--ink)}
.staff-card .sc-bio{font-size:.875rem;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* ===== 入力欄のはみ出しを防ぐ（iPhone の日付欄は「2026年10月19日」の長さで広がるため、枠に合わせる） ===== */
.fld,.fields,.lrow,.grp,.panel,.sec,.vw-box{min-width:0}
.fld input,.fld select,.fld textarea,input.btn,select.btn{max-width:100%;min-width:0;box-sizing:border-box}
input[type=date],input[type=month],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{margin-left:auto}
table.t input.btn,table.t select.btn{width:100%;max-width:160px}
table.t td{min-width:0}
/* ===== 小さなチェックの箇条書き（工事種別など） ===== */
.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr));gap:0 10px;padding:4px 0}
.checklist .ck{display:flex;align-items:center;gap:8px;min-height:38px;cursor:pointer;font-size:.92rem;line-height:1.3}
.checklist .ck input{width:20px;height:20px;min-height:0!important;flex:none;accent-color:var(--blue);margin:0}
.checklist .ck:has(input:checked){font-weight:700;color:var(--blue)}
/* ===== 希望工期（月をえらぶ） ===== */
.mrange{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.mrange .tilde{padding-bottom:12px;font-weight:700}
/* ===== 住所の右の「📍 地図」 ===== */
.inrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.map-btn{white-space:nowrap;padding:0 12px}
/* ===== 写真のアルバム ===== */
.album{display:grid;gap:10px;min-width:0}
.alb-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.alb-tabs .chipbtn{flex:none;display:inline-flex;align-items:center;gap:6px}
.alb-tabs .n{font-family:var(--f-num);font-size:.8rem;opacity:.75}
.alb-up{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:var(--sunk);border-radius:8px;padding:10px}
.alb-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alb-btns .btn{width:100%}
.alb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(30%,104px),1fr));gap:4px}
.alb-th{position:relative;aspect-ratio:1;max-width:100%;padding:0;border:none;border-radius:6px;overflow:hidden;background:var(--sunk);cursor:pointer;min-height:0!important}
.alb-th img{width:100%;height:100%;object-fit:cover;display:block}
.alb-th span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:.72rem!important;padding:10px 4px 3px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 写真を大きく見る */
.viewer{position:fixed;inset:0;z-index:80;background:rgba(15,10,5,.85);display:grid;place-items:center;overflow-y:auto;
  padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.vw-box{width:min(100%,640px);background:var(--surface);border-radius:10px;padding:12px;display:grid;gap:10px}
.vw-img{background:#111;border-radius:6px;display:grid;place-items:center;max-height:55vh;overflow:hidden}
.vw-img img{max-width:100%;max-height:55vh;object-fit:contain;display:block}
/* 工事の準備の表：スマホでは1項目ずつのカードにして、横にはみ出さない */
@media (max-width:700px){
  .prep-t,.prep-t tbody{display:block}
  .prep-t tr:first-child{display:none}
  .prep-t tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .prep-t td{display:grid;gap:2px;padding:0!important;border:none!important;height:auto!important}
  .prep-t td.pk-name{grid-column:1/-1;font-weight:700}
  .prep-t td[data-l="担当者"]{grid-column:1/-1}
  .prep-t td[data-l]::before{content:attr(data-l);font-size:.8rem;color:var(--muted);font-weight:700}
  .prep-t input.btn{max-width:100%!important}
}
/* 長い文字（名前・お客様名・工事名・住所など）は折り返す。1行で見せる所は「…」で切る */
body{overflow-wrap:anywhere}
.who-lbl{display:inline-block;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.ccard .cc-h b,.sc-tx b,.pm-btn b,.pk-tx b,.wk .bd b,.ag-ev b{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ccard .cc-h{min-width:0}.ccard .cc-h b{white-space:nowrap}
.case-card h1,.pickme h1,.pinpad h1,.prof h1,.panel h1{overflow-wrap:anywhere}
.sn-mid b,.sn-mid small{overflow-wrap:anywhere}
.staff-card .row{flex-wrap:wrap;min-width:0}
.warn-line{color:var(--bad);font-weight:700;font-size:.92rem;background:var(--bad-soft);border-radius:6px;padding:8px 10px}
/* カレンダーの日付メニュー */
.cal .dn{border:none;background:none;cursor:pointer;padding:2px 6px;border-radius:6px;min-height:0!important;font-family:var(--f-num);color:inherit}
.cal .dn:hover,.cal .dn:focus-visible{background:var(--blue-soft);color:var(--blue)}
.cal .d.today .dn{background:var(--blue);color:#fff}
.ds-box{max-height:85dvh;overflow-y:auto}
.ds-list{display:grid;gap:6px;max-height:34dvh;overflow-y:auto}
.btn.bad.pri{background:var(--bad);border-color:var(--bad);color:#fff}
/* お知らせ（なぞって消せる） */
#toast{touch-action:none;transition:transform .18s ease,opacity .18s ease;user-select:none;-webkit-user-select:none;padding-right:6px}
#toast .tt{flex:1;min-width:0}
.toast-x{border:none;background:transparent;color:inherit;font-size:1.3rem;line-height:1;min-width:40px;min-height:40px;cursor:pointer;opacity:.8}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* ホワイトボード／タイムラインの切り替え */
.wbseg{display:grid;grid-template-columns:1fr 1fr;width:100%;justify-self:stretch}
.wbseg button{position:relative;min-height:52px!important;font-size:1rem!important}
.wbseg .dot{position:absolute;top:8px;right:10px;width:12px;height:12px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nowIso=()=>new Date().toISOString();

function setP(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){const k=ks[i];if(a[k]==null||typeof a[k]!=='object')a[k]=/^\d+$/.test(ks[i+1])?[]:{};a=a[k]}a[ks[ks.length-1]]=v}
// 結果のお知らせ。undo を渡すと「元に戻す」ボタンが付き、少し長めに表示する
// お知らせ：横か下にスッとなぞる、または × で消せる。放っておいても数秒で消える
function toast(m,undo){const t=$('#toast');toast.undo=undo||null;
  t.innerHTML=`<span class="tt">${esc(m)}</span>${undo?'<button type="button" class="toast-undo" data-undo>元に戻す</button>':''}<button type="button" class="toast-x" data-toast-x aria-label="お知らせを閉じる">×</button>`;
  t.style.transform='';t.style.opacity='';t.classList.remove('gone');
  t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(hideToast,undo?6000:2800)}
function hideToast(dir){const t=$('#toast');if(!t||t.hidden)return;clearTimeout(toast.t);
  t.style.transform=dir==='x+'?'translate(60%,0)':dir==='x-'?'translate(-160%,0)':'translate(-50%,120%)';t.style.opacity='0';
  setTimeout(()=>{t.hidden=true;t.style.transform='';t.style.opacity='';toast.undo=null},180)}
(function(){ // なぞって消す
  const t=document.getElementById('toast'); let sx=0,sy=0,drag=false;
  t.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=true;sx=e.clientX;sy=e.clientY;t.style.transition='none';try{t.setPointerCapture(e.pointerId)}catch(_){}clearTimeout(toast.t)});
  t.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=Math.max(0,e.clientY-sy);t.style.transform=`translate(calc(-50% + ${dx}px),${dy}px)`;t.style.opacity=String(Math.max(.2,1-(Math.abs(dx)+dy)/220))});
  const end=e=>{if(!drag)return;drag=false;t.style.transition='';const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>50)hideToast(dx>0?'x+':'x-');else if(dy>30)hideToast('y');else{t.style.transform='';t.style.opacity='';toast.t=setTimeout(hideToast,2500)}};

})();

/* 社員アカウント
   staff/<ログインid>  … 本人がサインインして登録（本人と社長だけ編集）
   members/<m_…>     … 「アカウントを追加」で作る社員（ログインしない職人なども可。作成者と社長が編集）
   本人が初回登録で既存のアカウントを選ぶと claims で結び付き、同じ人として扱う */
let staff={}, members={}, roles={}, staffLoaded=false, P=null;
// 本人が結び付けたアカウント（claims）の対応表。社員が1000人いても毎回全員を数えないよう覚えておく
function claimMap(){const n=Object.keys(staff).length;if(claimMap.s===staff&&claimMap.n===n)return claimMap.v;
  // 同じアカウントを複数の端末が選んだ場合（機種変更など）は、いちばん新しく登録した端末を本人とする
  const v={};for(const k in staff){const m=staff[k].claims;if(m&&(!v[m]||(staff[k].createdAt||'')>(staff[v[m]].createdAt||'')))v[m]=k}
  claimMap.s=staff;claimMap.n=n;claimMap.v=v;return v}
function canon(id){if(!id)return null;if(staff[id])return id;const c=claimMap()[id];if(c)return c;return members[id]?id:null}
function person(id){
  const k=canon(id); if(!k)return null;
  return staff[k]?{...staff[k],id:k,kind:'login'}:{...members[k],id:k,kind:'member'};
}
function peopleList(){
  const claimed=new Set(Object.values(staff).map(s=>s.claims).filter(Boolean)), cm=claimMap();
  return [...Object.keys(staff).filter(id=>!staff[id].claims||cm[staff[id].claims]===id).map(id=>({...staff[id],id,kind:'login'})),
          ...Object.keys(members).filter(id=>!claimed.has(id)&&!members[id].retired).map(id=>({...members[id],id,kind:'member'}))]
    .filter(p=>p.name).sort((a,b)=>a.name.localeCompare(b.name,'ja'));
}
const pn=v=>{if(!v)return'';const p=person(v);return p?p.name:String(v)}; // 旧データ（文字で入力した担当者）にも対応
function sameP(a,b){if(!a||!b)return false;if(a===b)return true;const pa=canon(a),pb=canon(b);return !!pa&&pa===pb}
const whoName=id=>(person(id)||{}).name||names[id]||(id==='local'?'あなた':id==='sample'?'サンプル':'未登録の社員');
const roleOf=id=>id===me.id&&me.isOwner?'社長':'';
const uid=s=>`<span data-uid="${esc(s||'')}">${esc(whoName(s))}</span>`;
function avatar(id,size=40){const s=person(id)||{};const nm=whoName(id);
  return s.photo?`<img class="av" style="width:${size}px;height:${size}px" src="${esc(blobUrl(s.photo))}" alt="${esc(nm)}">`:`<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.max(14,size*.42)}px">${esc(nm.slice(0,1))}</span>`}
function whoOptions(v){const ps=peopleList(), legacy=v&&!person(v);

function renderPicker(qq){

  const dup={};all.forEach(p=>dup[p.name]=(dup[p.name]||0)+1);

  pk.innerHTML=`<div class="pk-box" role="dialog" aria-modal="true" aria-label="${esc(view.pick.label)}を選ぶ">

   <div class="pk-list">${hit.slice(0,40).map(item).join('')}${hit.length>40?`<div class="sub" style="padding:8px">ほか ${hit.length-40} 名。名前を入れて絞り込んでください。</div>`:''}${!hit.length?'<div class="sub" style="padding:8px">見つかりません。下の「新しいアカウントを作る」から追加できます。</div>':''}</div>
   <div class="row"><button type="button" class="btn" data-pick="">担当者を外す</button><button type="button" class="btn pri" data-pick-new>＋ 新しいアカウントを作る</button></div></div>`;

/* 自分の担当・工程のまとまり */
function isMine(c){if(!me.id)return false;return ASSIGN(c).some(v=>sameP(v,me.id))||sameP(c.createdBy,me.id)||((c.lead||{}).contacts||[]).some(k=>sameP(k.who,me.id))}

function phaseOf(c){if(isLost(c))return'lost';const i=curStage(c);if(i>=9)return'done';
  if((c.result||{}).status!=='won')return'sales';return approved(c,'invoice')||i>=7?'money':'build'}

/* 誰がどの工程を編集したか：同じ人・同じ工程の連続編集は15分まで1行にまとめる */
function noteEdit(c){
  const sec=view.tab==='case'&&C&&C.id===c.id?view.sec:'';const nm=([...STAGES,...EXTRA].find(s=>s.k===sec)||{}).n; if(!nm||sec==='log')return;

}
function touch(c){if(window.OUBI_HOST)OUBI_HOST.casesChanged();c.updatedAt=nowIso();c.updatedBy=me.id;dirty.add(c.id);setSaveBadge('保存中…');clearTimeout(timers[c.id]);timers[c.id]=setTimeout(()=>flush(c.id),700)}
async function flush(id){
  if(writing.has(id)){again.add(id);return}
  const c=cases.find(x=>x.id===id); if(!c)return;
  writing.add(id); dirty.delete(id);
  try{await store.setCase(c); retryN[id]=0; unsent(id,null); const d=new Date(); setSaveBadge(`✓ 保存しました ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`);}
  catch(e){
    if(GONE.has(id)||!cases.some(x=>x.id===id)){unsent(id,null);dirty.delete(id);writing.delete(id);return} // 送っている間に取り消し・削除された工事は、送り直さない
    if(e&&e.code==='invalid_argument'){setSaveBadge('保存できません');toast('保存できませんでした。合言葉の登録が切れています。設定の「この端末の登録をやめる」から入り直してください。');}
    else{ // 電波が弱いときなど：端末に控えを残し、間隔をあけて自動で送り直す
      dirty.add(id); unsent(id,c); const n=retryN[id]=(retryN[id]||0)+1;
      setSaveBadge('未送信（自動で再送します）'); if(n===1&&!toast.undo&&view.tab!=='sales')toast('電波が弱いため、まだ送れていません。この端末に控えを残し、自動で送り直します。'); // 「元に戻す」が出ている間は上書きしない（営業の画面は上の「送信待ち」で知らせる）
      clearTimeout(timers[id]); timers[id]=setTimeout(()=>flush(id),Math.min(30000,1500*n));
    }
  }
  writing.delete(id); if(again.delete(id)) flush(id);
}

/* ===================== 計算 ===================== */
function calc(c){
  const p=c.plan||{}, a=c.actual||{};
  const planSales=N(p.estimate)-N(p.discount);
  const planCost=COSTS.reduce((s,[k])=>s+N(p[k]),0);
  const planGross=planSales-planCost, planRate=planSales?planGross/planSales*100:null;
  const target=N(settings.targetRate);
  const contractAmt=N(c.contract&&c.contract.amount)||N(c.result&&c.result.amount);
  const vs=c.vendors||[];
  const vendorAmt=vs.reduce((s,v)=>s+N(v.amount),0), vendorPaid=vs.reduce((s,v)=>s+N(v.paid),0);
  const orderRemain=vs.reduce((s,v)=>s+Math.max(0,N(v.order)-N(v.amount)),0);
  const own=N(a.material)+N(a.labor)+N(a.other);
  const actSales=contractAmt+N(a.extra)-N(a.reduce);
  const actCost=vendorAmt+own, fcCost=actCost+orderRemain;
  const actGross=actSales-actCost, fcGross=actSales-fcCost;
  const ps=c.payments||[];
  const billed=ps.reduce((s,x)=>s+N(x.bill),0), received=ps.reduce((s,x)=>s+N(x.amount),0);
  return {planSales,planCost,planGross,planRate,target,targetGap:planGross-planSales*target/100,contractAmt,
    actSales,actCost,fcCost,actGross,fcGross,actRate:actSales?actGross/actSales*100:null,fcRate:actSales?fcGross/actSales*100:null,
    vendorAmt,vendorPaid,unpaid:vendorAmt-vendorPaid,orderRemain,billed,received,unreceived:billed-received,cashNet:received-vendorPaid};
}
function rateLv(r){const t=N(settings.targetRate);if(r==null)return'';if(r<0)return'bad';if(r<t)return'warn';return'ok'}
function rateWord(r){return{bad:'赤字見込み',warn:'基準未満',ok:'基準以上','':'未計算'}[rateLv(r)]}

/* v3：社長の承認はなくした。書類は金額と日付が入れば「作成済み」（そのまま画像にして渡せる） */
function docAmount(c,kind){const o=c[kind]||{};const it=(o.items||[]).filter(r=>r&&(r.name||N(r.price)));
  if(it.length)return it.reduce((s,r)=>s+Math.round(N(r.qty||1)*N(r.price)),0);
  if(kind==='contract')return N(o.amount)||N((c.result||{}).amount)||docAmount(c,'quote');
  if(kind==='invoice')return N(o.amount)||calc(c).contractAmt;
  return N(o.amount)}
function apprStatus(c,kind){const o=c[kind]||{}, amt=docAmount(c,kind);
  if(amt&&o.date)return'作成済み'; return amt||o.date?'作成中':'未作成'}
const apprCls=s=>({'作成済み':'ok','作成中':'warn'}[s]||'');
const approved=(c,k)=>apprStatus(c,k)==='作成済み';
const pendingAppr=()=>false;

function invoiceMissing(c){
  const m=[];
  if(!approved(c,'contract'))m.push('契約書が社長承認済みではありません');
  ['施工前','施工中','完工'].forEach(k=>{if(!photosOf(c,k).length)m.push(`${k}写真がアップロードされていません`)});
  const ch=(c.complete&&c.complete.checks)||{};
  CHECKS.forEach(k=>{const s=ch[k]||'未確認';if(s!=='確認済み'&&s!=='該当なし')m.push(`「${k}」が${s}です`)});
  if(!N(c.invoice&&c.invoice.amount))m.push('請求金額が未入力です');
  if(!((c.invoice&&c.invoice.files)||[]).length)m.push('請求書PDFがアップロードされていません');

}
function reqMissing(c,kind){
  if(kind==='invoice')return invoiceMissing(c);
  const m=[],x=calc(c),o=c[kind]||{};
  if(kind==='quote'){ if(!x.planSales||!x.planCost)m.push('事業収支書（予定見積金額と原価）が未入力です'); if(!N(o.amount))m.push('見積金額が未入力です'); }
  if(kind==='contract'){ if((c.result||{}).status!=='won')m.push('「契約になったか」で契約を記録していません'); if(!N(o.amount))m.push('契約金額が未入力です'); }
  if(!(o.files||[]).length&&!(kind==='quote'&&o.mitsuIssued))m.push(`${APPR_LABEL[kind]}のPDFがアップロードされていません`);
  return m;
}

/* 工程の進み */
function stageDone(c,i){
  const r=c.result||{}, s=c.schedule||{}, x=calc(c);
  switch(i){
   case 0:return !!((c.lead||{}).customer&&(c.lead||{}).date);
   case 1:return !!((c.work||{}).title&&((c.work||{}).types||[]).length&&(c.work||{}).surveyDate);
   case 2:return approved(c,'quote');
   case 3:return r.status==='won'||(r.status==='lost'&&!!r.reason);
   case 4:return !!(s.start&&s.end)&&PREP.every(k=>((s.prep||{})[k]||{}).done);
   case 5:return approved(c,'contract');
   case 6:return approved(c,'invoice');
   case 7:return x.billed>0&&x.unreceived<=0;
   case 8:return (c.vendors||[]).length>0&&(c.vendors||[]).every(v=>v.status==='支払完了');
  }
}
function isLost(c){return (c.result||{}).status==='lost'}
function curStage(c){if(isLost(c))return 3;for(let i=0;i<9;i++)if(!stageDone(c,i))return i;return 9}
function stageLabel(c){if(isLost(c))return'見送りで終了';const i=curStage(c);return i>=9?'全工程完了':STAGES[i].n}
function lockOf(c,i){
  if(i>=4&&isLost(c))return'見送りになったため、この工事は終わっています。もう一度営業する場合は「契約になったか」を変えてください。';
  if(i>=4&&(c.result||{}).status!=='won')return'「契約になったか」で契約を記録すると入力できます。';
  return'';
}

/* ===== v3：一人ずつのアカウントと4けたの暗証番号（PIN）
   ※ 会社の外の人は「会社の合言葉」で防ぐ。暗証番号は、社内でほかの人になりすますのを防ぐためのもの ===== */
async function pinHash(id,pin){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('oubi-pin:'+id+':'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
// まちがえた回数と待ち時間は端末に覚える（アプリを開き直しても続く）
const pinLockGet=id=>{try{return JSON.parse(localStorage.getItem('oubi.pinlock.'+id)||'{}')}catch(e){return{}}};

async function pinKey(k){
  const P=view.pin; if(!P||P.until>Date.now())return;
  if(k==='del')P.buf=P.buf.slice(0,-1); else if(P.buf.length<4)P.buf+=k;
  P.err=''; render();
  if(P.buf.length<4)return;
  const pin=P.buf;
  if(P.mode==='new'){P.first=pin;P.buf='';P.mode='confirm';render();return}
  if(P.mode==='confirm'){
    if(pin!==P.first){P.mode='new';P.buf='';P.first='';P.err='2回の番号がちがいました。もう一度、決めてください';render();return}
    const m=members[P.id]||{}, o={...m,pinHash:await pinHash(P.id,pin),updatedAt:nowIso(),updatedBy:P.id};
    try{await store.setMember(P.id,o);members[P.id]=o;const was=me.id===P.id;view.pin=null;if(was){setTab('settings');toast('暗証番号を変えました')}else becomeMe(P.id)}
    catch(e){P.buf='';P.err='保存できませんでした。電波のよい場所でもう一度入れてください';render()}
    return}
  // 入力して確かめる
  const ok=(members[P.id]||{}).pinHash===await pinHash(P.id,pin);
  if(ok){pinLockSet(P.id,null);view.pin=null;becomeMe(P.id);return}
  P.tries++;P.buf='';
  if(P.tries>=5){P.until=Date.now()+30000;P.tries=0;setTimeout(()=>{if(view.tab==='pin')render()},30100)}
  pinLockSet(P.id,{tries:P.tries,until:P.until});
  P.err=`番号がちがいます${P.tries?`（あと ${5-P.tries} 回）`:''}`;render();
}

    const pc=lsGet('oubi.wxpos.v1',null); if(pc&&pc.addr===addr&&pc.lat)pos=pc;
    const failed=pc&&pc.addr===addr&&pc.fail&&Date.now()-pc.fail<864e5; // 見つからない住所は1日聞き直さない
    if(!pos&&addr&&!failed){try{const g=await slFwdGeo(addr);if(g){pos={lat:g.lat,lon:g.lon,addr};lsSet('oubi.wxpos.v1',pos)}else lsSet('oubi.wxpos.v1',{addr,fail:Date.now()})}catch(e){}}

// 要対応の一覧は、工事・承認・設定のどれかが変わったときだけ数え直す
function alertsOf(){
  const key=today()+'|'+cases.length+'|'+cases.reduce((m,c)=>(c.updatedAt||'')>m?c.updatedAt:m,'')+'|'+Object.keys(dec).length+'|'+Object.values(dec).reduce((m,d)=>(d.at||'')>m?d.at:m,'')+'|'+settings.targetRate;
  if(alertsOf.k===key)return alertsOf.v;
  const v=alertsCompute(); alertsOf.k=key; alertsOf.v=v; return v;
}
function alertsCompute(){
  const out=[], t=today(), live=cases.filter(c=>!c.archived&&!isLost(c));
  const nm=c=>esc((c.lead||{}).customer||'名称未設定');
  live.forEach(c=>{
    const L=c.lead||{}, x=calc(c), s=c.schedule||{};
    if(!(L.contacts||[]).length&&L.date&&L.date<t) out.push(['bad','最初の連絡がまだ',`${nm(c)}：問い合わせのあと、連絡の記録がありません`,c.id,'lead']);
    const nx=(L.contacts||[]).map(k=>k.next).filter(Boolean).sort().pop(); if(nx&&nx<=t&&(c.result||{}).status!=='won') out.push(['warn','次回連絡予定日',`${nm(c)}：${md(nx)} に連絡予定`,c.id,'lead']);
    ['quote','contract','invoice'].forEach(k=>{const st=apprStatus(c,k);
      if(st==='差し戻し')out.push(['bad',APPR_LABEL[k]+'差し戻し',`${nm(c)}：修正して再申請してください`,c.id,k==='invoice'?'invoice':k]);
      if(st==='要再承認')out.push(['bad',APPR_LABEL[k]+'要再承認',`${nm(c)}：承認後に書類か金額が変わりました`,c.id,k]);
      if(pendingAppr(c,k)){const r=(c[k]||{}).req; if(r&&(Date.now()-new Date(r.at))>3*864e5) out.push(['warn','承認待ち長期化',`${nm(c)}：${APPR_LABEL[k]}が3日以上承認待ち`,c.id,k]);}});
    if(x.planSales&&rateLv(x.planRate)==='bad') out.push(['bad','赤字見込み',`${nm(c)}：予定粗利益率 ${pct(x.planRate)}`,c.id,'quote']);
    else if(x.planSales&&rateLv(x.planRate)==='warn') out.push(['warn','利益率が基準未満',`${nm(c)}：予定粗利益率 ${pct(x.planRate)}（基準 ${N(settings.targetRate)}%）`,c.id,'quote']);
    if(s.start&&!stageDone(c,4)&&(new Date(s.start)-new Date(t))<=7*864e5) out.push(['warn','工事の準備が残っています',`${nm(c)}：${md(s.start)} から工事で、準備が終わっていません`,c.id,'schedule']);
    if(s.start&&s.start<=t&&!approved(c,'contract')&&(c.result||{}).status==='won') out.push(['bad','契約書がまだの着工予定',`${nm(c)}：契約書がまだ作られていません`,c.id,'contract']);
    (s.steps||[]).forEach(st=>{if(st.end&&st.end<t&&st.progress!=='完了')out.push(['warn','工程遅延',`${nm(c)}：${esc(st.name||'工程')}が予定終了日を過ぎています`,c.id,'schedule'])});
    (s.changes||[]).forEach(ch=>{if((ch.customer||'未報告')!=='送信済み')out.push(['bad','工期変更の報告漏れ',`${nm(c)}：顧客への報告が「${esc(ch.customer||'未報告')}」`,c.id,'schedule'])});
    (c.payments||[]).forEach(p=>{if(N(p.bill)>N(p.amount)&&p.plan&&p.plan<t)out.push(['bad','入金遅延',`${nm(c)}：${esc(p.kind||'')} ${yen(N(p.bill)-N(p.amount))} 未入金（予定 ${md(p.plan)}）`,c.id,'payin'])});
    (c.vendors||[]).forEach(v=>{if(v.status!=='支払完了'&&v.planDate&&v.planDate<t&&N(v.amount)>N(v.paid))out.push(['bad','支払遅延',`${esc(v.name||'業者')}（${nm(c)}）：${yen(N(v.amount)-N(v.paid))}`,c.id,'payout']);
      else if(v.status!=='支払完了'&&v.planDate&&(new Date(v.planDate)-new Date(t))<=3*864e5&&v.planDate>=t)out.push(['warn','支払期限接近',`${esc(v.name||'業者')}（${nm(c)}）：${md(v.planDate)}`,c.id,'payout'])});
    if(approved(c,'invoice')&&!(c.invoice||{}).sentDate) out.push(['warn','請求書未送付',`${nm(c)}：作った請求書の送付日が未記録`,c.id,'invoice']);
  });
  overlaps().forEach(o=>out.push(['bad','工程重複',o.text,o.caseId,'schedule']));
  return out.sort((a,b)=>(a[0]==='bad'?0:1)-(b[0]==='bad'?0:1));
}
function overlaps(){
  // 業者ごとに日付順へ並べて隣どうしだけ比べる（全組み合わせを比べると案件が増えたとき重くなるため）
  const key=cases.map(c=>c.id+(c.updatedAt||'')).join('|'); if(overlaps.k===key)return overlaps.v;
  const by={};cases.filter(c=>!c.archived&&!isLost(c)).forEach(c=>((c.schedule||{}).steps||[]).forEach(s=>{if(s.partner&&s.start){const k=s.partner.trim();(by[k]=by[k]||[]).push({c,s,a:s.start,b:s.end||s.start})}}));
  const out=[];
  for(const k in by){const arr=by[k].sort((x,y)=>x.a.localeCompare(y.a));let open=null;
    for(const it of arr){ if(open&&it.a<=open.b&&it.c.id!==open.c.id){out.push({caseId:it.c.id,text:`${esc(k)}：「${esc((open.c.work||{}).title||open.c.lead.customer)}」と「${esc((it.c.work||{}).title||it.c.lead.customer)}」が ${md(it.a)} に重なっています`})}
      if(!open||it.b>open.b)open=it;}}
  overlaps.k=key;overlaps.v=out;return out;
}

/* カレンダーの日付を押したとき：「この日に何をしますか？」のメニュー */
function dayItems(day){
  const out=[], live=cases.filter(c=>!c.archived&&!isLost(c));
  live.forEach(c=>{const s=c.schedule||{},a=s.actualStart||s.start,b=s.actualEnd||s.end||a;
    if(a&&day>=a&&day<=b){const st=(s.steps||[]).find(x=>x.start&&x.start<=day&&(x.end||x.start)>=day);out.push({c,st})}
    const W=c.work||{},sd=W.surveyDate||W.surveyPlan; if(sd===day)out.push({c,survey:W.surveyDate?'現地調査（実施）':'現地調査（予定）'})});
  wbs.filter(w=>w.date===day).forEach(w=>out.push({wb:w}));
  slRvOn(day).forEach(v=>out.push({rv:v})); // 営業の再訪問（今日には、遅れているものも出す）
  return out;
}

function renderApprTab(){
  const items=[];cases.filter(c=>!c.archived).forEach(c=>['quote','contract','invoice'].forEach(k=>{if(pendingAppr(c,k))items.push([c,k])}));
  const back=[];cases.filter(c=>!c.archived).forEach(c=>['quote','contract','invoice'].forEach(k=>{const s=apprStatus(c,k);if(s==='差し戻し'||s==='要再承認')back.push([c,k])}));
  return `<div><h1>承認</h1><div class="sub">${me.isOwner?'見積書・契約書・請求書の承認申請が届きます。収支と書類を確認して承認または差し戻してください。':'社長の承認待ちの書類と、差し戻された書類の一覧です。'}</div></div>
  <section class="grp"><h3>承認待ち（${items.length}件）</h3>${items.length?items.map(([c,k])=>apprCard(c,k)).join(''):'<div class="empty">承認待ちの書類はありません。</div>'}</section>
  ${back.length?`<section class="grp"><h3>差し戻し・要再承認（${back.length}件）</h3>${back.map(([c,k])=>apprCard(c,k)).join('')}</section>`:''}`;
}

function helpGo(go){
  if(go.startsWith('#')){setTab('settings');setTimeout(()=>{const el=document.getElementById(go.slice(1));if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}else toast('この設定は管理者だけが使えます')},80);return}
  if(go.startsWith('case:')){const sec=go.slice(5), id=recentIds().find(x=>cases.some(c=>c.id===x&&!c.archived));
    if(id){openCase(id,sec||undefined);return} setTab('list');toast('まず一覧から工事を選んでください');return}
  if(go==='new'){openQuick();return}
  if(go==='onb'){OUBI_ONBOARD(true);return}
  if(go==='gsearch'){ftSearchOpen();return}
  if(go.startsWith('sales')){SV.sub=go.split(':')[1]||'rec';SV.pick=false;setTab('sales');return}
  if(go==='me'){P=null;view.returnTo=null;view.staffId=me.id;setTab('profile');return}
  if(go==='pin'){openPin(me.id,'new');return}
  if(go==='switch'){if(window.OUBI_SET_ME)window.OUBI_SET_ME('');me.id='';view.tab='pickme';render();return}
  setTab(go);
}

function dateWarns(s){const w=[];s=s||{};
  if(s.start&&s.end&&s.end<s.start)w.push('工事完了予定日が、工事開始予定日より前になっています。');
  if(s.actualStart&&s.actualEnd&&s.actualEnd<s.actualStart)w.push('実際の完工日が、実際の着工日より前になっています。');

  return w}

function applySnapshot(list){
  const map=new Map(list.filter(c=>!GONE.has(c.id)).map(c=>[c.id,c])); // 消した工事は、サーバーから消し終わるまでの知らせでもどさない
  // 編集中で未保存のものは手元を優先
  cases.forEach(c=>{if(dirty.has(c.id)||writing.has(c.id))map.set(c.id,c)});
  // 2分以内に手元で作った・直した工事は、取り直した一覧に（まだ届いていなくて）入っていなくても消さない
  {const lim=new Date(Date.now()-120000).toISOString();cases.forEach(c=>{if(!map.has(c.id)&&!GONE.has(c.id)&&(c.updatedAt||c.createdAt||'')>lim)map.set(c.id,c)})}
  cases=[...map.values()]; cases.forEach(fixResult); // 前の版の「契約になった」の保存のまちがいを、表示のときに直す
  if(C){const n=cases.find(x=>x.id===C.id);if(n)C=n}
  if(window.OUBI_HOST)OUBI_HOST.casesChanged();
  if(!applySnapshot.once){applySnapshot.once=true;resendUnsent()}
  if(!booted){booted=true;const y=window.scrollY;render();window.scrollTo(0,y);return}
  softRender();
}

  people:()=>peopleList(), whoName:id=>whoName(id), canon:id=>canon(id), calc:c=>calc(c), approved:(c,k)=>approved(c,k),
  touch:c=>touch(c), addLog:(c,t)=>addLog(c,t), makeCase:pre=>makeCase(pre), openCase:(id,sec)=>openCase(id,sec), setTab:t=>setTab(t),
  toast:m=>toast(m), softRender:()=>softRender(),
  markTab:on=>{view.ee=!!on;renderTabs();setNavH()},
  // 自社情報：見積の画面で直した名前・住所・電話などを、業務管理の設定にも入れる（空のものでは消さない）
  async setCompany(co){const n={...(settings.company||{})};Object.keys(co).forEach(k=>{if(co[k])n[k]=co[k]});
    if(JSON.stringify(n)===JSON.stringify(settings.company||{}))return;
    try{await store.setSettings({...settings,company:n});settings.company=n}catch(e){toast('会社の情報を業務管理の設定に保存できませんでした（社長の合言葉で入った端末で直してください）')}}
};
init();
/* スマホでは下のボタンを、上の帯（スクロールしても上に残る header）の外に出す。
   iPhone の Safari では、上に残る部品の中に「画面の下に固定」の部品があると、スクロールで一緒に動いてしまうため */
(function(){
  const nav=document.getElementById('tabs'), home=document.querySelector('.top-in'), who=document.querySelector('.hw');
  const mq=window.matchMedia('(max-width:820px)');
  const place=()=>{if(mq.matches){if(nav.parentElement!==document.body)document.body.appendChild(nav)}else if(nav.parentElement!==home)home.insertBefore(nav,who)};
  place(); if(mq.addEventListener)mq.addEventListener('change',place);else mq.addListener(place);
  // 下のボタンの高さ（文字の大きさで変わる）を測って、画面のいちばん下の余白をその分あける
  if(window.ResizeObserver)new ResizeObserver(setNavH).observe(nav);
  setNavH();
  window.addEventListener('resize',place); window.addEventListener('orientationchange',place);
})();
// アプリとして入れたとき、電波がなくても画面が開くようにする
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script>document.addEventListener=window.OUBI_ADD;</script>
